name: infra

services:
  postgres:
    image: postgres:16.4
    container_name: siem-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: siem
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: siem-elasticsearch
    depends_on:
      elasticsearch-backups-init:
        condition: service_completed_successfully
    environment:
      - discovery.type=single-node
      # 开发默认关闭；生产必须通过 SIEM_ES_SECURITY_ENABLED=true 并挂载 HTTP/transport TLS 证书。
      - xpack.security.enabled=${SIEM_ES_SECURITY_ENABLED:-false}
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?filter_path=status | grep -qE 'green|yellow' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - es-data:/usr/share/elasticsearch/data
      # 目录级挂载 config(含补齐的 jvm.options/log4j2 默认文件 + 带 path.repo 的 elasticsearch.yml)。
      # 不要改回单文件挂载 elasticsearch.yml:Docker Desktop 文件级 bind mount 在文件被替换后
      # 快照失效,容器重启报 mount: no such file or directory(exit 127)。
      - ./elasticsearch/config:/usr/share/elasticsearch/config
      - es-backups:/usr/share/elasticsearch/backups

  # named volume 首次创建时通常属于 root;ES 以 uid 1000 运行,快照写入会失败。
  # 该一次性初始化容器在 ES 启动前修正目录属主,不会改变业务数据。
  elasticsearch-backups-init:
    image: alpine:3.20
    volumes:
      - es-backups:/backups
    command: ["sh", "-c", "chown -R 1000:0 /backups && chmod 750 /backups"]
    restart: "no"

  kibana:
    image: kibana:8.14.0
    container_name: siem-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5601' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  logstash:
    image: logstash:8.14.0
    container_name: siem-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5007:5007"
      - "5006:5006"
      - "5005:5005"
      - "5004:5004"
      - "5002:5002"
      - "5001:5001"
      - "9600:9600"
    environment:
      - LS_HEAP_SIZE=1g
    healthcheck:
      # 必须同时检查监控端口和全部数据输入端口,避免容器 healthy 但 pipeline 尚未启动。
      test: ["CMD-SHELL", "for port in 5000 5001 5002 5004 5005 5006 9600; do timeout 2 bash -c \"</dev/tcp/127.0.0.1/$$port\" >/dev/null 2>&1 || exit 1; done"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      # 目录级挂载 config(内含补齐的 jvm.options/log4j2 等默认文件)。
      # 不要改回单文件挂载 logstash.yml/pipelines.yml:Docker Desktop 对"文件级 bind mount"在
      # rsync 原地替换源文件后会缓存失效,导致容器 restart/up 报 mount: no such file or directory(exit 127)。
      - ./logstash/config:/usr/share/logstash/config
      - logstash-data:/usr/share/logstash/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: siem-kafka
    ports:
      # 容器内客户端使用 INTERNAL/kafka:9092；宿主机客户端使用
      # EXTERNAL/localhost:9092。两者共用宿主机 9092，避免 Kafka 元数据把
      # 宿主机客户端重定向到仅 Docker 网络可解析的 kafka:9092。
      - "9092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 开发默认 PLAINTEXT；生产 overlay 必须改为 SASL_SSL/SCRAM 并挂载证书。
      KAFKA_LISTENERS: ${SIEM_KAFKA_LISTENERS:-INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093}
      KAFKA_ADVERTISED_LISTENERS: ${SIEM_KAFKA_ADVERTISED_LISTENERS:-INTERNAL://kafka:9092,EXTERNAL://localhost:9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${SIEM_KAFKA_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${SIEM_KAFKA_INTER_BROKER_LISTENER:-INTERNAL}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${SIEM_KAFKA_OFFSETS_REPLICATION_FACTOR:-1}
    volumes:
      - kafka-data:/tmp/kafka-logs
  flink-jobmanager:
    image: flink:2.1-java21
    container_name: siem-flink-jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      # checkpoint/savepoint 持久卷(DetectionJob 配置了 file:///opt/flink/checkpoints)
      # 注意:全新 volume(首次 up 或 down -v 后)目录属主是 root,
      #       Flink(flink 用户)无写权限会导致 job 启动失败。需先执行:
      #       docker exec -u root siem-flink-jobmanager chown -R flink:flink /opt/flink/checkpoints
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: jobmanager

  flink-taskmanager:
    image: flink:2.1-java21
    container_name: siem-flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    command: taskmanager

volumes:
  es-data:
  es-backups:
  flink-checkpoints:
  kafka-data:
  logstash-data:
  postgres-data:
