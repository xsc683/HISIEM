formatVersion: "2"
id: case-investigation-kickoff
name: 案件调查启动
description: 记录自动化证据、人工审批、延迟复核并更新案件状态，审批拒绝走独立终止分支。
version: "2.0"
enabled: true
resourceTypes:
  - case
defaults:
  timeoutSeconds: 20
  retry:
    maxAttempts: 2
    delaySeconds: 2
    backoffMultiplier: 2.0
entrypoint: record-playbook-evidence
nodes:
  - id: record-playbook-evidence
    name: 记录自动化启动证据
    type: action
    action: case.add_evidence
    with:
      type: automation
      title: "SOAR 调查流程已启动"
      note: "执行 ${executionId} 使用 Playbook ${playbookId} v2"
    transitions:
      - target: approve-investigation
        on: success

  - id: approve-investigation
    name: 分析师审批接手案件
    type: approval
    with:
      requiredRole: analyst
      message: "确认接手案件 ${caseId} 并进入 investigating 状态"
    transitions:
      - target: short-hold
        on: approved
      - target: rejected
        on: rejected

  - id: short-hold
    name: 审批后短暂延迟
    type: delay
    delaySeconds: 2
    transitions:
      - target: set-investigating

  - id: set-investigating
    name: 案件进入调查状态
    type: action
    action: case.set_status
    with:
      status: investigating
    transitions:
      - target: notify-case-started
        on: success
      - target: failed
        on: failure

  - id: notify-case-started
    name: 通知调查已启动
    type: action
    action: notification.create
    with:
      type: soar-case-investigation
      target: "case:${caseId}"
      message: "案件 ${caseId} 已通过 SOAR 进入调查状态。"
    transitions:
      - target: completed

  - id: completed
    name: 案件启动流程完成
    type: end
    result: succeeded

  - id: rejected
    name: 审批拒绝结束
    type: end
    result: rejected

  - id: failed
    name: 案件更新失败结束
    type: end
    result: failed
