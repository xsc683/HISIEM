# 检测规则声明(检测即代码单一来源,story-03)
# cep:同 keyField 事件时间窗内按 pattern 序列匹配(首个 begin + 后续 next/followedBy)
id: rule-ssh-bruteforce-success-001
name: SSH 暴力破解成功
category: cep
type: ssh_bruteforce_success
enabled: true
severity: critical
description: 同一源 IP 短时间多次认证失败后成功登录,疑似暴力破解得逞
riskScore: 90
tags: ["attack.t1110.001", "attack.t1078.002"]
status: experimental
version: "1.0"
references:
  - "MITRE:https://attack.mitre.org/techniques/T1110/"
  - "MITRE:https://attack.mitre.org/techniques/T1078/"
keyField: source.ip
cep:
  withinMinutes: 10
  pattern:
    - name: failures
      type: begin
      timesMin: 5
      timesMax: 100
      condition: { type: field_equals, field: event.action, value: authentication_failure }
    - name: success
      type: next
      condition: { type: field_equals, field: event.action, value: authentication_success }
