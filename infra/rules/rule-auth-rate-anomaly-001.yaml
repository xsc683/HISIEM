id: rule-auth-rate-anomaly-001
name: 认证失败率异常(基线突增)
category: baseline
type: auth_rate_anomaly
enabled: true
severity: high
description: 该主机认证失败数超出滚动基线(μ+3σ),疑似暴力破解加剧
riskScore: 60
tags: ["attack.t1110.001"]
status: experimental
version: "1.0"
references:
  - "MITRE:https://attack.mitre.org/techniques/T1110/"
  - "https://attack.mitre.org/techniques/T1110/001/"
baseline:
