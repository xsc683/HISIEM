# Logstash 主配置(Phase 3.0-L4)
# 持久化队列:事件先落盘再处理,Logstash 崩溃/重启时不丢 tcp 输入的事件
# (tcp input 无 ack 机制,内存队列在崩溃瞬间会丢事件)。
# 队列数据存于 path.data(默认 /usr/share/logstash/data),已在 compose 挂持久卷。
queue.type: persisted
queue.max_bytes: 1gb

# 死信队列(Phase 3.1-L5):ES 拒收(400/404 等不可重试错误)的事件落入 DLQ 兜底,可回读重放
dead_letter_queue.enable: true
