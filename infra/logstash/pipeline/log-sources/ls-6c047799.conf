input {
  tcp {
    port => 5001
    add_field => { "log.source_id" => "ls-6c047799" "log.source_name" => "test" }
  }
}

filter {
    # grok 解析(模板 firewall)
    grok {
      match => { "message" => [
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} kernel: \[%{DATA:fw.chain}\] IN=%{WORD:network.direction} OUT=%{DATA:network.direction_out} SRC=%{IP:source.ip} DST=%{IP:destination.ip} .*PROTO=%{WORD:network.transport} SPT=%{NUMBER:source.port} DPT=%{NUMBER:destination.port}",
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} kernel: %{DATA:fw.action} IN=%{WORD:network.direction} OUT=%{DATA:network.direction_out} SRC=%{IP:source.ip} DST=%{IP:destination.ip} .*PROTO=%{WORD:network.transport} SPT=%{NUMBER:source.port} DPT=%{NUMBER:destination.port}"
      ] }
      tag_on_failure => ["_parsefailure"]
    }
    # @timestamp = 日志时间
    date {
      match => [ "timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
      timezone => "Asia/Shanghai"
      target => "@timestamp"
    }
    mutate {
      add_field => { "event.category" => "network" }
    }
    if [message] =~ /DENY|DROP/ {
      mutate { add_field => { "event.action" => "denied" "event.outcome" => "failure" "event.type" => "denied" } }
    }
    if [message] =~ /ACCEPT|ALLOW/ {
      mutate { add_field => { "event.action" => "allowed" "event.outcome" => "success" "event.type" => "allowed" } }
    }

  # 字段规范化(ECS 对齐,决策 D:扁平存储)
  mutate {
    remove_field => [ "timestamp" ]
    add_field => {
      "pipeline" => "mini-siem"
      "event.schema_version" => "1.0"
    }
    add_field => { "related.ip" => "%{source.ip}" }
  }
  if [source.ip] {
    geoip {
      source => "source.ip"
      target => "source"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-events-%{+YYYY.MM.dd}"
  }

  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id => "siem-events"
    codec => json
    acks => "all"
    retries => 5
    retry_backoff_ms => 1000
    compression_type => "zstd"
    batch_size => 131072
    linger_ms => 5
  }
}
