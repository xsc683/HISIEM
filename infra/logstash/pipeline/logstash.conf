input {
  tcp {
    port => 5000
  }
}

filter {
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} sshd.*Failed password for %{USERNAME:user.name} from %{IP:source.ip}"
    }
  }

  # @timestamp = 日志发生时间(修复:此前是 Logstash 摄入时间)
  # SYSLOGTIMESTAMP 不含年份,date filter 自动补当年并处理年末回绕
  date {
    match => [ "timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
    timezone => "Asia/Shanghai"
    target => "@timestamp"
  }

  # 字段规范化(ECS 对齐,决策 D:扁平存储)
  mutate {
    remove_field => [ "timestamp" ]
    add_field => {
      "pipeline" => "mini-siem"
      "event.category" => "authentication"
      "event.action" => "authentication_failure"
      "event.outcome" => "failure"
      "event.type" => "denied"
      "event.schema_version" => "1.0"
    }
    add_field => { "related.ip" => "%{source.ip}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-events-%{+YYYY.MM.dd}"
    # 注:Logstash 内部把点分字段(event.source.ip 等)存为嵌套对象,
    # 无法强制扁平。ES 查询点分路径(如 source.ip)不受扁平/嵌套影响。
  }

  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id => "siem-events"
    codec => json
  }

  stdout {
    codec => rubydebug
  }
}
