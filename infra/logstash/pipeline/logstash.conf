input {
  tcp {
    port => 5000
  }
}

filter {
  # 解析 SSH 认证日志,支持三种变体:
  #   普通失败:    Failed password for user
  #   invalid user(暴力破解常用形态,漏解析会静默丢日志)
  #   成功登录:    Accepted password for user(供 CEP 攻击链规则使用)
  # 匹配失败打 _parsefailure 标签,便于计数与排查。
  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} sshd.*Failed password for %{USERNAME:user.name} from %{IP:source.ip}",
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} sshd.*Failed password for invalid user %{USERNAME:user.name} from %{IP:source.ip}",
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host.name} sshd.*Accepted password for %{USERNAME:user.name} from %{IP:source.ip}"
      ]
    }
    tag_on_failure => ["_parsefailure"]
  }

  # @timestamp = 日志发生时间(修复:此前是 Logstash 摄入时间)
  # SYSLOGTIMESTAMP 不含年份,date filter 自动补当年并处理年末回绕
  date {
    match => [ "timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
    timezone => "Asia/Shanghai"
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }

  # 字段规范化(ECS 对齐,决策 D:扁平存储);event.action/outcome/type 依成功/失败区分
  mutate {
    remove_field => [ "timestamp" ]
    add_field => {
      "pipeline" => "mini-siem"
      "event.category" => "authentication"
      "event.schema_version" => "1.0"
    }
    add_field => { "related.ip" => "%{source.ip}" }
  }

  if [message] =~ /Failed password/ {
    mutate {
      add_field => {
        "event.action" => "authentication_failure"
        "event.outcome" => "failure"
        "event.type" => "denied"
      }
    }
  } else if [message] =~ /Accepted password/ {
    mutate {
      add_field => {
        "event.action" => "authentication_success"
        "event.outcome" => "success"
        "event.type" => "allowed"
      }
    }
  }

  # GeoIP 富化(at-ingest,Phase 3.3):给攻击源 IP 加地理上下文(source.geo.*)
  # 数据库用 Logstash 内置 GeoLite2-City;解析失败(source.ip 缺失)时跳过。
  # ECS 兼容模式下 target 用 ECS 前缀 "source",filter 自动产出 source.geo.country_name 等;
  # 不要用 "source.geo" 作 target(非法前缀会导致结构错乱)。
  if [source.ip] {
    geoip {
      source => "source.ip"
      target => "source"
    }

    # 威胁情报富化(MVP,threat-intel.md):本地字典查表,写 threat.is_malicious/confidence(字符串)。
    # 字典在 config 目录(ti-malicious.yml/ti-confidence.yml),由 infra/ti/update-ti.py 每日更新;
    # translate 字典值始终为字符串,fallback 须同类型,避免同字段类型不一致。
    translate {
      source => "[source][ip]"
      target => "threat.is_malicious"
      dictionary_path => "/usr/share/logstash/config/ti-malicious.yml"
      fallback => "false"
    }
    translate {
      source => "[source][ip]"
      target => "threat.confidence"
      dictionary_path => "/usr/share/logstash/config/ti-confidence.yml"
      fallback => "0"
    }
  }
}

output {
  # 未知桶分流(L9,siem-events-raw):解析失败(_parsefailure)的日志路由到独立 raw 索引,
  # 保留原文可查(排查窗口,非长期存储),**不进 Kafka → 不进 Flink 检测**(不产生告警)。
  # 事件模板 priority:siem-events-raw-template.json(200)> siem-events-template.json(100),
  # 避免平级模板 tie-break 覆盖 match_only_text 语义。
  if "_parsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siem-events-raw-%{+YYYY.MM.dd}"
      # 注:Logstash 内部把点分字段存为嵌套对象,ES 查询点分路径不受影响。
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siem-events-%{+YYYY.MM.dd}"
      # 注:Logstash 内部把点分字段(event.source.ip 等)存为嵌套对象,
      # 无法强制扁平。ES 查询点分路径(如 source.ip)不受扁平/嵌套影响。
    }

    kafka {
      bootstrap_servers => "kafka:9092"
      topic_id => "siem-events"
      codec => json
      # 可靠性:acks=all + 重试(单 broker RF=1 下仍值得,为将来多 broker 兜底)
      acks => "all"
      retries => 5
      retry_backoff_ms => 1000
      # 性能:JSON 日志 zstd 压缩约 3-4x;linger 5ms 对 SIEM 低流量足够
      compression_type => "zstd"
      batch_size => 131072
      linger_ms => 5
    }
  }

  # 生产默认关闭 stdout(避免每事件序列化到控制台浪费 CPU/IO)。
  # 调试解析时:临时取消下面注释并 restart logstash 即可看到完整解析结果。
  # stdout {
  #   codec => rubydebug
  # }
}
