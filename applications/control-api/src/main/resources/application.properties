spring.application.name=hsiem-platform
app.production-mode=${SIEM_PRODUCTION:false}
app.process-role=${SIEM_PROCESS_ROLE:all}
# 非检测物理运维适配器保持既有开发行为；可用环境变量关闭。
app.operations.process-adapters=${SIEM_OPERATIONS_PROCESS_ADAPTERS:enabled}
# 控制面数据库(生产默认连接 infra/docker-compose.yml 中的 PostgreSQL;可用环境变量覆盖)
spring.datasource.url=${SIEM_DB_URL:jdbc:postgresql://localhost:5432/siem}
spring.datasource.username=${SIEM_DB_USERNAME:siem}
spring.datasource.password=${SIEM_DB_PASSWORD:siem_dev_only}
spring.datasource.hikari.maximum-pool-size=${SIEM_DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
app.control-plane.persistence=jdbc
# 进程内异步任务无法跨重启续跑；超过该窗口的 queued/running 任务会被标记为 failed。
app.tasks.stale-after=${SIEM_TASK_STALE_AFTER:PT5M}
app.tasks.recovery-interval-ms=${SIEM_TASK_RECOVERY_INTERVAL_MS:60000}
app.tasks.recovery-initial-delay-ms=${SIEM_TASK_RECOVERY_INITIAL_DELAY_MS:60000}
# 案件控制面(PostgreSQL)到 ES 兼容镜像的最终一致性收敛。
app.cases.mirror-reconcile-initial-delay-ms=${SIEM_CASE_MIRROR_RECONCILE_INITIAL_DELAY_MS:120000}
app.cases.mirror-reconcile-interval-ms=${SIEM_CASE_MIRROR_RECONCILE_INTERVAL_MS:300000}
# 解析模板目录(相对仓库根;也支持绝对路径)
app.parser-templates-dir=infra/parser-templates
# 数据源声明目录(Story 01,文件 + Git)
app.log-sources-dir=infra/log-sources
# 生效链路:Logstash 配置文件位置(仓库相对路径)
app.logstash.pipeline-dir=infra/logstash/pipeline
app.logstash.config-dir=infra/logstash/config
# 生效链路:docker-compose(数据源端口自动映射,路线B)
app.logstash.compose-file=infra/docker-compose.yml
# 生效链路:外部命令参数(WSL 仓库路径 / 部署目录 / 容器名 / 容器内 pipeline 根)
app.logstash.wsl-repo-path=/mnt/d/Project/SIEM
app.logstash.deploy-dir=~/projects/mini-siem
app.logstash.container-name=siem-logstash
app.logstash.container-pipeline-root=/usr/share/logstash/pipeline
# 检测规则目录(story-03,与 Flink 同一份 infra/rules)+ ES 查询地址(hits)
app.rules-dir=infra/rules
# Runtime manifest placement buckets; must remain positive.
app.detection.group-buckets=${SIEM_DETECTION_GROUP_BUCKETS:1}
# SOAR lifecycle runtime: only alert/case lifecycle topics may create executions.
app.soar.runtime-enabled=${SIEM_SOAR_RUNTIME_ENABLED:true}
app.soar.worker-poll-ms=${SIEM_SOAR_WORKER_POLL_MS:500}
app.soar.worker-lease=${SIEM_SOAR_WORKER_LEASE:PT30S}
app.soar.worker-batch-size=${SIEM_SOAR_WORKER_BATCH_SIZE:10}
app.soar.kafka-consumer-enabled=${SIEM_SOAR_KAFKA_CONSUMER_ENABLED:true}
app.soar.kafka-bootstrap=${SIEM_KAFKA_BOOTSTRAP:localhost:9092}
app.soar.kafka-group=${SIEM_SOAR_KAFKA_GROUP:siem-soar-runtime}
app.soar.alert-topic=${SIEM_ALERT_LIFECYCLE_TOPIC:siem-alert-lifecycle}
app.soar.case-topic=${SIEM_CASE_LIFECYCLE_TOPIC:siem-case-lifecycle}
app.soar.kafka-security-protocol=${SIEM_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
app.soar.kafka-sasl-mechanism=${SIEM_KAFKA_SASL_MECHANISM:}
app.soar.kafka-sasl-jaas-config=${SIEM_KAFKA_SASL_JAAS_CONFIG:}
app.soar.kafka-ssl-truststore-location=${SIEM_KAFKA_SSL_TRUSTSTORE_LOCATION:}
app.soar.kafka-ssl-truststore-password=${SIEM_KAFKA_SSL_TRUSTSTORE_PASSWORD:}
app.soar.lifecycle-outbox-enabled=${SIEM_SOAR_LIFECYCLE_OUTBOX_ENABLED:true}
app.soar.lifecycle-outbox-lease=${SIEM_SOAR_LIFECYCLE_OUTBOX_LEASE:PT2M}
app.soar.lifecycle-outbox-batch-size=${SIEM_SOAR_LIFECYCLE_OUTBOX_BATCH_SIZE:50}
app.soar.lifecycle-outbox-initial-delay-ms=${SIEM_SOAR_LIFECYCLE_OUTBOX_INITIAL_DELAY_MS:5000}
app.soar.lifecycle-outbox-poll-ms=${SIEM_SOAR_LIFECYCLE_OUTBOX_POLL_MS:5000}
app.elasticsearch.url=${SIEM_ES_URL:http://localhost:9200}
app.elasticsearch.username=${SIEM_ES_USERNAME:}
app.elasticsearch.password=${SIEM_ES_PASSWORD:}
# 数据健康判定最小样本数,避免少量失败导致误报
app.health.minimum-samples=20
# 资产关键度文件(story-06,entity-risk.py 读取)
app.criticality-file=infra/elasticsearch/asset-criticality.json
# 控制台用户文件(story-08 RBAC):仅用于首次启动从旧版本导入，之后以 PostgreSQL 为准
app.auth-users-file=infra/auth/users.yaml
# 会话持久化与登录保护(Token 原文只返回一次,数据库仅保存 SHA-256)
app.auth.session-ttl=${SIEM_AUTH_SESSION_TTL:PT8H}
app.auth.max-login-failures=${SIEM_AUTH_MAX_LOGIN_FAILURES:5}
app.auth.login-window=${SIEM_AUTH_LOGIN_WINDOW:PT15M}
app.auth.login-lockout=${SIEM_AUTH_LOGIN_LOCKOUT:PT15M}
# HISIEM-Agent 服务端启动代理；凭据只由 SIEM 服务端读取，不进入浏览器。
app.agent.base-url=${HISIEM_AGENT_BASE_URL:http://127.0.0.1:8000}
app.agent.ui-base-url=${HISIEM_AGENT_UI_BASE_URL:${HISIEM_AGENT_BASE_URL:http://127.0.0.1:8000}}
app.agent.bearer-token=${HISIEM_AGENT_BEARER_TOKEN:}
app.agent.timeout=${HISIEM_AGENT_TIMEOUT:PT10S}
# 首次启动且 users 表为空时必须显式设置；不会再接受生产默认口令。
app.auth.bootstrap-password=${SIEM_BOOTSTRAP_PASSWORD:}
# Actuator/Micrometer:健康、指标和 Prometheus 仅暴露必要端点
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.health.soarKafka.enabled=${SIEM_SOAR_KAFKA_HEALTH_ENABLED:true}
management.info.env.enabled=true
# 运维健康扫描依赖地址(均可用环境变量覆盖)
app.health.scan.flink-url=${SIEM_FLINK_URL:http://localhost:8081}
app.health.scan.kibana-url=${SIEM_KIBANA_URL:http://localhost:5601}
app.health.scan.logstash-url=${SIEM_LOGSTASH_URL:http://localhost:9600}
app.health.scan.kafka-host=${SIEM_KAFKA_HOST:localhost}
app.health.scan.kafka-port=${SIEM_KAFKA_PORT:9092}
app.health.scan.kafka-topic=${SIEM_KAFKA_TOPIC:siem-events}
app.health.scan.kafka-group=${SIEM_KAFKA_GROUP:siem-detection}
app.health.scan.kafka-max-lag=${SIEM_KAFKA_MAX_LAG:10000}
app.health.scan.kafka-security-protocol=${SIEM_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
app.health.scan.kafka-sasl-mechanism=${SIEM_KAFKA_SASL_MECHANISM:}
app.health.scan.kafka-sasl-jaas-config=${SIEM_KAFKA_SASL_JAAS_CONFIG:}
app.health.scan.kafka-ssl-truststore-location=${SIEM_KAFKA_SSL_TRUSTSTORE_LOCATION:}
app.health.scan.kafka-ssl-truststore-password=${SIEM_KAFKA_SSL_TRUSTSTORE_PASSWORD:}
