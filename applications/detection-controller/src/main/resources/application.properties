spring.application.name=hsiem-detection-controller
mybatis.mapper-locations=classpath*:mybatis/detection/*.xml
mybatis.configuration.map-underscore-to-camel-case=false
spring.main.web-application-type=none
spring.datasource.url=${SIEM_DB_URL:jdbc:postgresql://localhost:5432/siem}
spring.datasource.username=${SIEM_DB_USERNAME:siem}
spring.datasource.password=${SIEM_DB_PASSWORD:siem_dev_only}
spring.datasource.hikari.maximum-pool-size=${SIEM_DETECTION_CONTROLLER_DB_POOL_SIZE:5}
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
app.detection.group-buckets=${SIEM_DETECTION_GROUP_BUCKETS:1}
app.detection.runtime-adapter=${SIEM_DETECTION_RUNTIME_ADAPTER:disabled}
app.detection.cluster-id=${SIEM_DETECTION_CLUSTER_ID:default}
app.detection.allowed-clusters=${SIEM_DETECTION_ALLOWED_CLUSTERS:}
app.detection.container-name=${SIEM_DETECTION_CONTAINER_NAME:siem-flink-jobmanager}
app.detection.jar-path=${SIEM_DETECTION_JAR_PATH:/opt/flink/detection-job-1.0.jar}
app.detection.artifact-root=${SIEM_DETECTION_ARTIFACT_ROOT:./data/detection-artifacts}
app.detection.container-artifact-root=${SIEM_DETECTION_CONTAINER_ARTIFACT_ROOT:/opt/flink/detection-artifacts}
app.detection.savepoint-root=${SIEM_DETECTION_SAVEPOINT_ROOT:file:///opt/flink/savepoints}
app.detection.command-timeout=${SIEM_DETECTION_COMMAND_TIMEOUT:PT120S}
app.detection.verify-poll=${SIEM_DETECTION_VERIFY_POLL:PT1S}
app.detection.controller.owner=${SIEM_DETECTION_CONTROLLER_OWNER:}
app.detection.controller.lease=${SIEM_DETECTION_CONTROLLER_LEASE:PT30S}
app.detection.controller.batch-size=${SIEM_DETECTION_CONTROLLER_BATCH_SIZE:10}
app.detection.controller.poll-ms=${SIEM_DETECTION_CONTROLLER_POLL_MS:5000}
app.detection.controller.initial-delay-ms=${SIEM_DETECTION_CONTROLLER_INITIAL_DELAY_MS:1000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
