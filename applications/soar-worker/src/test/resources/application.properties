# 测试专用配置:让独立 SOAR worker 的 composition root 能在没有真实 PostgreSQL / Kafka
# 的情况下完整装配,从而让"映射器漏扫 / Bean 缺失"这类启动缺陷在构建期就失败。
spring.datasource.url=jdbc:h2:mem:siem-worker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.rules-dir=infra/rules
app.log-sources-dir=target/test-log-sources
app.parser-templates-dir=infra/parser-templates
app.logstash.pipeline-dir=target/test-logstash/pipeline
app.logstash.config-dir=target/test-logstash/config
app.logstash.compose-file=infra/docker-compose.yml
# 测试专用凭据:仅用于 Spring 上下文装配,生产必须通过环境变量提供。
app.auth.bootstrap-password=admin123
app.agent.bearer-token=test-agent-service-credential
app.internal-service.token=test-internal-service-credential
app.operations.process-adapters=disabled
app.soar.kafka-consumer-enabled=false
management.health.soarKafka.enabled=false
management.health.elasticsearch.enabled=false
