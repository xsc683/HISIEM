name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java format check
        run: bash ./mvnw --batch-mode spotless:check
      - name: Spring Boot tests
        run: bash ./mvnw --batch-mode test

  flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Flink Java format check
        run: bash ./mvnw --batch-mode -f flink/pom.xml spotless:check
      - name: Flink tests and package
        run: bash ./mvnw --batch-mode -f flink/pom.xml clean package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix web ci
      - name: Unit tests
        run: npm --prefix web test
      - name: Production build
        run: npm --prefix web run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: web
        run: npm run test:e2e
