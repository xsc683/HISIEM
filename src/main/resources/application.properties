spring.application.name=hsiem-platform
# 控制面数据库(生产默认连接 infra/docker-compose.yml 中的 PostgreSQL;可用环境变量覆盖)
spring.datasource.url=${SIEM_DB_URL:jdbc:postgresql://localhost:5432/siem}
spring.datasource.username=${SIEM_DB_USERNAME:siem}
spring.datasource.password=${SIEM_DB_PASSWORD:siem_dev_only}
spring.datasource.hikari.maximum-pool-size=${SIEM_DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
app.control-plane.persistence=jdbc
# 解析模板目录(相对仓库根;也支持绝对路径)
app.parser-templates-dir=infra/parser-templates
# 数据源声明目录(Story 01,文件 + Git)
app.log-sources-dir=infra/log-sources
# 生效链路:Logstash 配置文件位置(仓库相对路径)
app.logstash.pipeline-dir=infra/logstash/pipeline
app.logstash.config-dir=infra/logstash/config
# 生效链路:docker-compose(数据源端口自动映射,路线B)
app.logstash.compose-file=infra/docker-compose.yml
# 生效链路:外部命令参数(WSL 仓库路径 / 部署目录 / 容器名 / 容器内 pipeline 根)
app.logstash.wsl-repo-path=/mnt/d/Project/SIEM
app.logstash.deploy-dir=~/projects/mini-siem
app.logstash.container-name=siem-logstash
app.logstash.container-pipeline-root=/usr/share/logstash/pipeline
# 检测规则目录(story-03,与 Flink 同一份 infra/rules)+ ES 查询地址(hits)
app.rules-dir=infra/rules
app.elasticsearch.url=http://localhost:9200
# 数据健康判定最小样本数,避免少量失败导致误报
app.health.minimum-samples=20
# 规则部署生效(story-03:同步规则到 Flink jobmanager + 重启检测 job)
app.flink.wsl-repo-path=/mnt/d/Project/SIEM
app.flink.container-name=siem-flink-jobmanager
app.flink.jar-name=detection-job-1.0.jar
app.flink.savepoint-dir=file:///opt/flink/savepoints
# 资产关键度文件(story-06,entity-risk.py 读取)
app.criticality-file=infra/elasticsearch/asset-criticality.json
# 控制台用户文件(story-08 RBAC):仅用于首次启动从旧版本导入，之后以 PostgreSQL 为准
app.auth-users-file=infra/auth/users.yaml
