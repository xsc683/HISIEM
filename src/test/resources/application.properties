spring.datasource.url=jdbc:h2:mem:siem;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.auth-users-file=target/test-auth-users.yaml
app.log-sources-dir=target/test-log-sources
app.parser-templates-dir=infra/parser-templates
app.logstash.pipeline-dir=target/test-logstash/pipeline
app.logstash.config-dir=target/test-logstash/config
app.logstash.compose-file=infra/docker-compose.yml
app.criticality-file=target/test-criticality.json
app.auth.bootstrap-password=admin123
app.soar.runtime-enabled=false
app.soar.kafka-consumer-enabled=false
management.health.soarKafka.enabled=false
management.health.elasticsearch.enabled=false
